name: CI - Smart Retail AI Platform

on:
  push:
    branches: [ main, engineering/reproducibility-and-release ]
  pull_request:
    branches: [ main, engineering/reproducibility-and-release ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build datasets, models and evaluation suite
        run: |
          python scripts/build_all_models.py

      - name: Run automated test suite
        run: |
          pytest tests/ -v --maxfail=1

      - name: Build and verify release distribution bundle (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/package_release.py

      - name: Upload release distribution artifact (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: smart-retail-ai-v1.2.0-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
